<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spacetime-kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- Inline loading skeleton — visible immediately before JS boots -->
      <div id="initial-skeleton" style="display:flex;min-height:100vh;background:#0a0a0a;color:#a1a1aa;font-family:Inter,system-ui,sans-serif">
        <aside style="width:224px;border-right:1px solid #27272a;background:#171717;padding:16px;flex-shrink:0;display:none" class="sk-desktop-sidebar">
          <div style="display:flex;align-items:center;gap:8px;padding-bottom:16px;border-bottom:1px solid #27272a;margin-bottom:16px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span style="font-weight:600;font-size:14px;color:#fafafa">Kanban</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <div style="height:8px;width:120px;background:#262626;border-radius:4px;animation:pulse 1.5s infinite"></div>
            <div style="height:8px;width:80px;background:#262626;border-radius:4px;animation:pulse 1.5s infinite;margin-top:8px"></div>
            <div style="height:8px;width:100px;background:#262626;border-radius:4px;animation:pulse 1.5s infinite;margin-top:8px"></div>

            <div style="height:8px;width:75px;background:#262626;border-radius:4px;animation:pulse 1.5s infinite;margin-top:8px"></div>
          </div>
        </aside>
        <main style="flex:1;padding:24px;max-width:100%;overflow:hidden">
          <!-- Header skeleton -->
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
            <div style="display:flex;align-items:center;gap:12px">
              <div style="width:140px;height:24px;background:#262626;border-radius:6px;animation:pulse 1.5s infinite"></div>
              <div style="width:48px;height:20px;background:#262626;border-radius:999px;animation:pulse 1.5s infinite"></div>
            </div>
            <div style="display:flex;gap:8px">
              <div style="width:80px;height:32px;background:#262626;border-radius:6px;animation:pulse 1.5s infinite"></div>
              <div style="width:80px;height:32px;background:#262626;border-radius:6px;animation:pulse 1.5s infinite"></div>
            </div>
          </div>
          <!-- Table skeleton for default list view -->
          <div style="display:flex;flex-direction:column;gap:16px">
            <!-- Toolbar skeleton -->
            <div style="display:flex;align-items:center;justify-content:space-between">
              <div style="display:flex;align-items:center;gap:8px">
                <div style="width:160px;height:32px;background:#262626;border-radius:6px;animation:pulse 1.5s infinite"></div>
                <div style="width:120px;height:32px;background:#262626;border-radius:6px;animation:pulse 1.5s infinite"></div>
              </div>
              <div style="display:flex;gap:8px">
                <div style="width:80px;height:32px;background:#262626;border-radius:6px;animation:pulse 1.5s infinite"></div>
                <div style="width:140px;height:32px;background:#262626;border-radius:6px;animation:pulse 1.5s infinite"></div>
              </div>
            </div>
            <!-- Table skeleton -->
            <div style="border:1px solid #27272a;border-radius:8px;overflow:hidden">
              <div style="background:#1a1a1a;border-bottom:1px solid #27272a;padding:10px 12px;display:flex;align-items:center;gap:16px">

                <div style="width:64px;height:14px;background:#262626;border-radius:4px;animation:pulse 1.5s infinite"></div>

                  <div style="width:80px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:56px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:48px;height:16px;background:#262626;border-radius:4px"></div>
                </div>
                <div style="display:flex;align-items:center;gap:16px;padding:12px 12px;border-bottom:1px solid #1f1f1f;animation:pulse 1.5s infinite;animation-delay:0.05s">
                  <div style="width:32px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:44px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:240px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:72px;height:16px;background:#262626;border-radius:4px;margin-left:auto"></div>
                  <div style="width:68px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:60px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:48px;height:16px;background:#262626;border-radius:4px"></div>
                </div>

                  <div style="width:32px;height:16px;background:#262626;border-radius:4px"></div>

                  <div style="width:48px;height:16px;background:#262626;border-radius:4px"></div>

                  <div style="width:32px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:48px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:190px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:60px;height:16px;background:#262626;border-radius:4px;margin-left:auto"></div>

                  <div style="width:48px;height:16px;background:#262626;border-radius:4px"></div>
                </div>
                <div style="display:flex;align-items:center;gap:16px;padding:12px 12px;border-bottom:1px solid #1f1f1f;animation:pulse 1.5s infinite;animation-delay:0.2s">
                  <div style="width:32px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:40px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:260px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:56px;height:16px;background:#262626;border-radius:4px;margin-left:auto"></div>
                  <div style="width:64px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:48px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:48px;height:16px;background:#262626;border-radius:4px"></div>
                </div>
                <div style="display:flex;align-items:center;gap:16px;padding:12px 12px;animation:pulse 1.5s infinite;animation-delay:0.25s">
                  <div style="width:32px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:52px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:220px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:76px;height:16px;background:#262626;border-radius:4px;margin-left:auto"></div>
                  <div style="width:60px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:56px;height:16px;background:#262626;border-radius:4px"></div>
                  <div style="width:48px;height:16px;background:#262626;border-radius:4px"></div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
      <style>
        @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:0.8} }
        @media (min-width:1024px) { .sk-desktop-sidebar { display:flex !important } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
