[project]
name = "spacetimedb-kanban"
version = "0.1.0"
description = "Atomic multi-agent kanban on SpacetimeDB — shared task coordination for AI agents"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "omiinaya", email = "omiinaya@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "S110"]
# Utility/seed scripts — intentional file:// reads and subprocess calls
"_fast_seed.py" = ["S310", "S603", "S607"]
"_task_fountain.py" = ["S310", "S603", "S607", "S110", "S112"]
# Scanner tools — run as CLI tools with intentional subprocess usage
"scanners/*" = ["S603", "S607", "S110", "S112", "S310"]
# MCP server — reads files via file:// scheme for stdio transport
"mcp_server.py" = ["S310"]
# Server intentionally binds 0.0.0.0 for container deployment
"main.py" = ["S104"]
# Worker modules — subprocess-heavy by design; uses full paths in practice
"workers/*" = ["S603", "S607", "S110", "S112", "S310"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: End-to-end tests that hit the real HTTP server at localhost:8727",
]
