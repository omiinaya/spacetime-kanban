name: CD — Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (wasm target)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: wasm32-unknown-unknown
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build STDB wasm module
        run: cd server/spacetimedb && cargo build --release --target wasm32-unknown-unknown

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Install Python deps
        run: cd server && pip install -r requirements.txt

      - name: Run tests
        run: cd server && python -m pytest tests/ -v -x --tb=short

      - name: Publish STDB module
        if: github.ref == 'refs/heads/main'
        env:
          SPACETIME_SERVER: ${{ secrets.STDB_SERVER || 'http://localhost:3001' }}
        run: |
          cd server/spacetimedb && \
          spacetime publish \
            -b target/wasm32-unknown-unknown/release/spacetimedb_kanban.wasm \
            -s "$SPACETIME_SERVER" \
            --yes kanban 2>&1

      - name: Deploy backend
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "Deploy to $DEPLOY_HOST"
          # Example: rsync server/ to target, restart service
          # ssh -i "$DEPLOY_KEY" "root@$DEPLOY_HOST" "cd /opt/kanban && git pull && systemctl restart kanban"
