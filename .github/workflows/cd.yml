name: CD — Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (wasm target)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: wasm32-unknown-unknown
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build STDB wasm module
        run: cd server/spacetimedb && cargo build --release --target wasm32-unknown-unknown

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Install Python deps
        run: cd server && pip install -r requirements.txt

      - name: Run tests
        run: cd server && python -m pytest tests/ -v -x --tb=short

      - name: Publish STDB module
        if: github.ref == 'refs/heads/main'
        env:
          SPACETIME_SERVER: ${{ secrets.STDB_SERVER || '' }}
        run: |
          if [ -z "$SPACETIME_SERVER" ]; then
            echo "No STDB_SERVER configured — skipping publish"
            exit 0
          fi
          cd server/spacetimedb && \
          spacetime publish \
            -b target/wasm32-unknown-unknown/release/spacetime_kanban.wasm \
            -s "$SPACETIME_SERVER" \
            --yes kanban 2>&1

      - name: Deploy backend
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "No DEPLOY_HOST configured — skipping deploy"
            exit 0
          fi
          echo "Deploying to $DEPLOY_HOST..."
          ssh -o StrictHostKeyChecking=no -i "$DEPLOY_KEY" "root@$DEPLOY_HOST" \
            "cd /opt/kanban && git pull && systemctl restart kanban"
