version: "3.9"

services:
  spacetime:
    image: clockworklabs/spacetime:v2.7.1
    container_name: spacetime-kanban-db
    ports:
      - "127.0.0.1:3001:3001"  # HTTP API (loopback only — no LAN exposure)
      - "127.0.0.1:3002:3002"  # WebSocket (loopback only — no LAN exposure)
    volumes:
      - stdb-data:/var/spacetime
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: .
    container_name: spacetime-kanban-backend
    ports:
      - "8727:8727"  # FastAPI server
    environment:
      - STDB_HOST=spacetime
      - STDB_PORT=3001
      - SERVER_PORT=8727
      - KANBAN_STDB_RETRIES=60
    depends_on:
      spacetime:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stdb-data:
